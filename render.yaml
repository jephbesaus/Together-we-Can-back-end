services:
  - type: web
    name: together-we-can-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: together-we-can-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_ACTIVATION_CODE
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: together-we-can-db
    databaseName: together_we_can
    user: together_we_can
