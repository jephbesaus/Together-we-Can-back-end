<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Together We Can - Administration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="loginView" class="auth-shell">
        <form id="loginForm" class="auth-card">
            <div class="brand-mark">TWC</div>
            <p class="eyebrow">ESPACE SÉCURISÉ</p>
            <h1>Administration</h1>
            <p class="muted">Connectez-vous avec le compte administrateur autorisé.</p>
            <label>Email<input id="email" type="email" autocomplete="username" required></label>
            <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
            <label id="activationField" class="hidden">Code d'activation<input id="activationCode" inputmode="numeric"></label>
            <button type="submit" class="primary">Se connecter</button>
            <p id="loginMessage" class="message" role="alert"></p>
        </form>
    </main>

    <main id="appView" class="app-shell hidden">
        <aside class="sidebar">
            <div class="sidebar-brand"><span class="brand-mark small">TWC</span><strong>Admin</strong></div>
            <nav>
                <button class="nav-item active" data-section="dashboard">Vue générale</button>
                <button class="nav-item" data-section="users">Utilisateurs</button>
                <button class="nav-item" data-section="premium">Demandes premium</button>
                <button class="nav-item" data-section="reports">Signalements</button>
                <button class="nav-item" data-section="posts">Publications</button>
                <button class="nav-item" data-section="products">Produits</button>
                <button class="nav-item" data-section="courses">Cours</button>
            </nav>
            <button id="logoutButton" class="logout">Se déconnecter</button>
        </aside>
        <section class="content">
            <header class="topbar">
                <div><p class="eyebrow">TOGETHER WE CAN</p><h1 id="sectionTitle">Vue générale</h1></div>
                <span id="adminEmail" class="admin-email"></span>
            </header>
            <p id="appMessage" class="message" role="status"></p>
            <div id="sectionContent"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
