name: together_we_can
description: Application communautaire Together We Can
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.6.5

  # UI & Utils
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  timeago: ^3.6.0
  intl: ^0.18.1
  flutter_staggered_grid_view: ^0.7.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.3
  pusher_channels_flutter: ^2.2.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  app_links: ^6.3.0

  # Image & Video
  image_picker: ^1.0.5
  file_picker: 10.0.0
  video_player: ^2.8.2

  # Shimmer / Loading
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
