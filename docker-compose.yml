services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twc-backend
    ports:
      - "8083:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8083
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/twc.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - .:/var/www/html
    restart: unless-stopped
